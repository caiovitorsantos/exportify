name: Release

# Publicar no RubyGems ao criar uma tag vX.Y.Z
# ou manualmente via Actions > Release > Run workflow
#
# Pré-requisito: adicionar o secret RUBYGEMS_API_KEY nas configurações
# do repositório (Settings > Secrets > Actions).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    environment: rubygems

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build gem
        run: gem build exportify.gemspec

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push exportify-*.gem
